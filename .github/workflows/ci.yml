name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Core unit, fixture and stdio tests
        run: npm test
      - name: Reusable MCP client fixtures
        run: node --test benchmarks/mcp-client.test.mjs

  windows-faults:
    name: Windows subprocess faults and installer policy
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local fake-provider fault scenarios
        run: node benchmarks/provider-fallback-process-tests.mjs
      - name: Installer rules in fake temporary homes
        run: python benchmarks/installer-policy-tests.py
      - name: Upload sanitized scenario aggregate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fault-results
          path: benchmarks/windows-fault-results.json
          if-no-files-found: ignore

  # The real cloud install on a fresh Ubuntu machine (what an Oracle or other VPS gets). It signs in to nothing,
  # so no subscription is used; it ends by running DeltaRoute's tests on that machine.
  cloud-install:
    name: Cloud install on fresh Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install with cloud/install.sh
        run: bash cloud/install.sh
      - name: Tools, config and phone access service are in place
        run: |
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          command -v claude codex gemini tmux
          node -e "const c=require('./config.json');if(!c.browser?.command||!require('fs').existsSync(c.browser.command))throw Error('research browser missing');console.log('browser',c.browser.command)"
          systemctl is-enabled deltaroute-remote.service
          bash cloud/remote.sh

  # The same container GitHub Codespaces builds from .devcontainer: no systemd, non-root user, install on create.
  codespace:
    name: Codespaces container from .devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the Codespaces container, then check it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
            command -v claude codex gemini tmux
            node -e "const c=require('./config.json');if(!c.browser?.command||!require('fs').existsSync(c.browser.command))throw Error('research browser missing');console.log('browser',c.browser.command)"
            # Codex's own sandbox (its bundled bubblewrap) must be able to start, or every Codex job fails here.
            BWRAP="$(find "$HOME/.npm-global/lib/node_modules/@openai" -path '*codex-resources/bwrap' | head -1)"
            "$BWRAP" --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev true && echo "Codex sandbox can start"
            test -L "$HOME/.codex" -o ! -e "$HOME/.codex" && test -d /workspaces/.deltaroute-home && echo "Sign-in folders kept under /workspaces"
            bash cloud/remote.sh
